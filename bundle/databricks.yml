bundle:
  name: custbrief-bundle

targets:
  dev:
    default: true
    workspace:
      host: https://<your-workspace>.azuredatabricks.net

resources:
  jobs:
    customer_pre_brief_job:
      name: "Customer Pre Brief"
      tasks:
        - task_key: run_customer_pre_brief
          job_cluster_key: simple_cluster
          notebook_task:
            notebook_path: ./src/customer_pre_brief.ipynb
      job_clusters:
        - job_cluster_key: simple_cluster
          new_cluster:
            spark_version: 14.3.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1
